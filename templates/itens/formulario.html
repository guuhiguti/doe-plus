{% extends "dashboard_layout.html" %}

{% block title %}Novo item - Doe+{% endblock %}

{% block dashboard_content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="h3 mb-4">Novo item do catálogo</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <input type="text" name="category" class="form-control" placeholder="Ex: Alimento, Roupa, Higiene" value="{{ category or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Item</label>
          <input type="text" name="name" class="form-control" placeholder="Ex: Arroz" value="{{ name or '' }}" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="{{ url_for('itens.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
