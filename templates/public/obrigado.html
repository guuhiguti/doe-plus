{% extends "base.html" %}
{% from "_macros.html" import logo_icon with context %}

{% block title %}Obrigado - {{ organization.name }}{% endblock %}

{% block content %}
<nav class="navbar navbar-expand navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/">
      {{ logo_icon(40) }}
    </a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center text-center py-5 my-5">
    <div class="col-md-6">
      <h1 class="h3 fw-bold mb-3">Recebemos sua resposta!</h1>
      <p class="text-muted">Obrigado por enviar suas informações para {{ organization.name }}.</p>
    </div>
  </div>
</div>
{% endblock %}
