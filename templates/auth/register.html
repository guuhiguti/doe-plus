{% extends "base.html" %}
{% from "_macros.html" import logo_icon with context %}

{% block title %}Criar conta - Doe+{% endblock %}

{% block content %}
<nav class="navbar navbar-expand navbar-light bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/">
      {{ logo_icon(44) }}
    </a>
  </div>
</nav>
<div class="container">
  <div class="row justify-content-center py-5 my-5">
    <div class="col-md-5">
      <h1 class="h3 mb-4 text-center">Criar conta</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Nome da organização</label>
          <input type="text" name="organization_name" class="form-control" value="{{ organization_name or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Seu nome</label>
          <input type="text" name="name" class="form-control" value="{{ name or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100">Criar conta</button>
      </form>
      <p class="text-center mt-3">
        Já tem uma conta? <a href="/auth/login">Entrar</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
