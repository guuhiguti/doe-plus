{% extends "base.html" %}
{% from "_macros.html" import logo_icon with context %}

{% block content %}
<div class="dash-shell" id="dash-shell">
  <aside class="dash-sidebar">
    <div class="dash-sidebar-top">
      <a href="{{ url_for('main.dashboard') }}" class="d-flex align-items-center text-decoration-none">
        {{ logo_icon(32) }}
      </a>
      <button type="button" class="dash-toggle" onclick="toggleSidebar()" aria-label="Abrir ou fechar menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>

    <nav class="dash-nav">
      <a href="{{ url_for('main.dashboard') }}" class="dash-link {{ 'active' if request.endpoint == 'main.dashboard' }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        <span class="dash-label">Dashboard</span>
      </a>
      <a href="{{ url_for('colaboradores.listar') }}" class="dash-link {{ 'active' if request.endpoint.startswith('colaboradores.') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M17 11a4 4 0 1 0-3-6.7"/><path d="M1 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span class="dash-label">Colaboradores</span>
      </a>
      <a href="{{ url_for('pedidos.listar') }}" class="dash-link {{ 'active' if request.endpoint.startswith('pedidos.') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6"/><path d="M9 15h6"/></svg>
        <span class="dash-label">Pedidos de ajuda</span>
      </a>
      <a href="{{ url_for('itens.listar') }}" class="dash-link {{ 'active' if request.endpoint.startswith('itens.') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        <span class="dash-label">Itens</span>
      </a>
      <a href="{{ url_for('matches.listar') }}" class="dash-link {{ 'active' if request.endpoint.startswith('matches.') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 7h6a4 4 0 0 1 3 1.3"/><path d="M21 17l-4 4-4-4"/><path d="M3 17h6a4 4 0 0 0 3-1.3"/></svg>
        <span class="dash-label">Cruzamentos</span>
      </a>
    </nav>

    <div class="dash-nav-bottom">
      <a href="{{ url_for('equipe.listar') }}" class="dash-link {{ 'active' if request.endpoint.startswith('equipe.') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="dash-label">Equipe</span>
      </a>
      <a href="{{ url_for('main.perfil') }}" class="dash-link {{ 'active' if request.endpoint == 'main.perfil' }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></svg>
        <span class="dash-label">Perfil da OSC</span>
      </a>
      <a href="{{ url_for('main.configuracoes') }}" class="dash-link {{ 'active' if request.endpoint == 'main.configuracoes' }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="dash-label">Configurações</span>
      </a>
      <a href="{{ url_for('auth.logout') }}" class="dash-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="dash-label">Sair</span>
      </a>
    </div>
  </aside>

  <main class="dash-main">
    {% block dashboard_content %}{% endblock %}
  </main>
</div>

<script>
(function () {
  const shell = document.getElementById('dash-shell');
  if (localStorage.getItem('doeplus_sidebar_collapsed') === '1') {
    shell.classList.add('collapsed');
  }
})();

function toggleSidebar() {
  const shell = document.getElementById('dash-shell');
  shell.classList.toggle('collapsed');
  localStorage.setItem('doeplus_sidebar_collapsed', shell.classList.contains('collapsed') ? '1' : '0');
}
</script>
{% endblock %}
